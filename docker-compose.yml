version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: trustpilot-ai-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - DATABASE_URL=postgresql://trustpilot:secure_password@db:5432/trustpilot_ai
      - JWT_SECRET=production_secret_key_minimum_32_characters_long
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    container_name: trustpilot-ai-db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=trustpilot
      - POSTGRES_PASSWORD=secure_password
      - POSTGRES_DB=trustpilot_ai
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:

